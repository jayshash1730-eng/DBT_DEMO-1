models:
  - name: dim_employees
    description: "Employee dimension mart table"
    columns:
      - name: employee_id
        description: "Primary key for employees"
        tests:
          - not_null
          - unique
      - name: first_name
        tests:
          - not_null

      - name: department_name
        tests:
          - not_null

      - name: mart_loaded_at
        tests:
          - not_null